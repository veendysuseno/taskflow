<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="brand">
                <div class="brand-icon">✓</div>
                <div>
                    <h2>TaskFlow</h2>
                    <span>Task Manager</span>
                </div>
            </div>

            <nav class="navigation">

                <button class="nav-item active" data-filter="all">
                    <span>📋</span>
                    Semua Task
                    <span class="nav-count" id="allCount">0</span>
                </button>

                <button class="nav-item" data-filter="active">
                    <span>⏳</span>
                    Aktif
                    <span class="nav-count" id="activeCount">0</span>
                </button>

                <button class="nav-item" data-filter="completed">
                    <span>✅</span>
                    Selesai
                    <span class="nav-count" id="completedCount">0</span>
                </button>

            </nav>

            <div class="sidebar-bottom">

                <button id="themeToggle" class="theme-button">
                    🌙
                    <span>Dark Mode</span>
                </button>

                <div class="sidebar-footer">
                    <small>TaskFlow v1.0</small>
                </div>

            </div>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">

                <div>
                    <p class="welcome">Selamat datang 👋</p>
                    <h1>My Tasks</h1>
                </div>

                <div class="date-display" id="currentDate"></div>

            </header>


            <!-- Statistics -->
            <section class="statistics">

                <div class="stat-card">
                    <div class="stat-icon blue">📋</div>
                    <div>
                        <span>Total Task</span>
                        <strong id="totalTasks">0</strong>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon orange">⏳</div>
                    <div>
                        <span>Belum Selesai</span>
                        <strong id="pendingTasks">0</strong>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon green">✅</div>
                    <div>
                        <span>Selesai</span>
                        <strong id="doneTasks">0</strong>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon purple">📊</div>
                    <div>
                        <span>Progress</span>
                        <strong id="progressText">0%</strong>
                    </div>
                </div>

            </section>


            <!-- Progress -->
            <section class="progress-section">

                <div class="progress-header">
                    <span>Overall Progress</span>
                    <strong id="progressPercent">0%</strong>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

            </section>


            <!-- Toolbar -->
            <section class="toolbar">

                <div class="search-box">
                    <span>🔍</span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Cari task..."
                    >
                </div>

                <select id="priorityFilter">

                    <option value="all">Semua Prioritas</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>

                </select>

                <button id="addTaskButton" class="add-button">
                    + Tambah Task
                </button>

            </section>


            <!-- Task List -->
            <section class="task-section">

                <div class="section-header">

                    <div>
                        <h2 id="sectionTitle">Semua Task</h2>
                        <p id="taskDescription">
                            Kelola semua pekerjaan Anda
                        </p>
                    </div>

                    <button id="clearCompleted" class="clear-button">
                        Hapus yang selesai
                    </button>

                </div>


                <div id="taskList" class="task-list"></div>


                <div id="emptyState" class="empty-state">

                    <div class="empty-icon">🎉</div>

                    <h3>Tidak ada task</h3>

                    <p>
                        Belum ada pekerjaan yang harus dilakukan.
                    </p>

                    <button id="emptyAddButton">
                        Tambah Task
                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- Modal -->
    <div id="modal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <div>
                    <h2>Tambah Task</h2>
                    <p>Buat pekerjaan baru</p>
                </div>

                <button id="closeModal" class="close-button">
                    ×
                </button>

            </div>


            <form id="taskForm">

                <div class="form-group">

                    <label for="taskTitle">
                        Nama Task
                    </label>

                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="Contoh: Belajar JavaScript"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="taskDescriptionInput">
                        Deskripsi
                    </label>

                    <textarea
                        id="taskDescriptionInput"
                        placeholder="Deskripsi task..."
                    ></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="taskPriority">
                            Prioritas
                        </label>

                        <select id="taskPriority">

                            <option value="low">
                                Low
                            </option>

                            <option value="medium" selected>
                                Medium
                            </option>

                            <option value="high">
                                High
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="taskDate">
                            Deadline
                        </label>

                        <input
                            type="date"
                            id="taskDate"
                        >

                    </div>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelButton"
                        class="cancel-button"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        class="save-button"
                    >
                        Simpan Task
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
